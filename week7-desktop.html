<section aria-labelledby="dwk-title" style="position: relative; overflow: hidden; background-color: #0A1F14; background-image: radial-gradient(ellipse at 4% -10%, rgba(255,248,214,.13), transparent 34%), radial-gradient(ellipse at 96% -10%, rgba(255,248,214,.13), transparent 34%), repeating-linear-gradient(90deg, rgba(239,237,224,.045) 0 1px, transparent 1px 128px); color: #EFEDE0; padding: 52px max(88px, calc((100% - 1200px) / 2)) 56px; border-bottom: 4px solid #C9A24B">

<h1 id="dwk-title" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(64px, 6.4vw, 92px); line-height: .95; letter-spacing: .005em; text-wrap: balance">Virginia moves up to second</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #C3D2C7; max-width: 30em; text-wrap: pretty">Drew went 3-1 and stretched his lead to a full point. Virginia went 3-0 with Buffalo on bye and is second, Mike went 1-3 and slipped to third, and Nicole jumped from seventh into a three-way tie for fourth.</p>
<div style="display: flex; gap: 10px; margin-top: 8px">

<button type="button" style="flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 6px; border: 1px solid #2A5A3F; background: transparent; color: #EFEDE0; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg width="17" height="17" style="flex: none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>Copy group text</button>
</div>
<a href="rules.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 700; color: #C9A24B; text-decoration: none">First time here? How scoring works<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Standings after Week 7" style="background: #051109; border: 1px solid #1D4530; border-radius: 8px; padding: 4px 18px 2px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #1D4530; font-size: 13px; color: #8FA898"><span style="font-weight: 700; color: #C9A24B">Standings after Week 7</span><span>Final</span></div>
<div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 60px 60px 50px; gap: 12px; padding: 8px 0 4px; font-size: 12px; color: #8FA898"><span></span><span>Coach and teams</span><span style="text-align: right">Week 7</span><span style="text-align: right">Points</span><span style="text-align: right">Move</span></div>

<p style="margin: 0; font-size: 15.5px">Houston, New Orleans, the Giants and the 49ers are off in Week 8, and both the Texans and Giants are Mike’s, so he plays this week with two teams.</p>
<div style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--panel)">
<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line)">
<span style="font-size: 13.5px; font-weight: 800; color: var(--soft); padding-top: 3px">Week 9</span>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>PIT</b> Luke</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>TEN</b> Luke</span></div><span style="font-size: 14px; color: var(--soft)">Luke loses the Steelers and Titans in the same week. Only two teams are off.</span></div>
</div>
<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 13px 16px">
<span style="font-size: 13.5px; font-weight: 800; color: var(--soft); padding-top: 3px">Week 10</span>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>CHI</b> Nicole</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>DEN</b> Caleb</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>PHI</b> Luke</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>TB</b> Virginia</span></div><span style="font-size: 14px; color: var(--soft)">Four teams off, one each for four coaches.</span></div>
</div>
