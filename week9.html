<h2 id="notes-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">How everyone's week went</h2>
<p style="margin: 6px 0 4px; font-size: 14.5px; color: var(--soft)">In standings order. The chip is each coach's record for the week.</p>

<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Virginia</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--gold); color: var(--ongold)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px; color: var(--gold)">21 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Still first, and by two now. Buffalo beat Drew’s Vikings 23-6 on Monday night, and Cincinnati beat Drew’s Falcons 34-17 in Madrid. Cleveland lost 23-22 in New Orleans, and Tampa Bay lost 27-24 at Chicago on Sunday night. The Bills are 7-1.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Drew</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">19 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Detroit won 19-9 in Miami. The other three lost: Baltimore 33-10 at home to Luke’s Jaguars on Thursday night, Atlanta to the Bengals in Madrid, and Minnesota 23-6 to the Bills on Monday night. That’s four losses in a row for the Ravens and two for the Vikings. Tied for second, two back.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Nicole</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">19 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Chicago beat Virginia’s Bucs 27-24 on Sunday night, the Rams won 20-13 in Washington, and Dallas won 27-23 at my Colts. Only Arizona lost, 17-3 in Seattle. Up from third to a tie for second, her highest spot of the season.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Mike</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">17.5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Kansas City beat Caleb’s Jets 35-12, the Giants won 19-11 in Philadelphia, and Houston beat Court’s Chargers 44-22. Only Carolina lost, 26-21 to Caleb’s Broncos. Sixth to fourth.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Caleb</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">17 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Denver won 26-21 in Carolina, its fifth win in a row, and New Orleans edged Virginia’s Browns 23-22. The Jets lost 35-12 in Kansas City, and New England gave up 45 to my Packers. Tied with me for fifth.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Jack</b><span style="font-size: 12px; color: var(--soft)">(me)</span><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">17 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Green Bay won 45-27 in New England, and Seattle beat Nicole’s Cardinals 17-3. The Colts lost 27-23 to Nicole’s Cowboys, their fifth loss in a row, and the Raiders lost 38-17 in San Francisco. Tied with Caleb for fifth.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Luke</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">15 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Pittsburgh and Tennessee were off, so he had two. Jacksonville won 33-10 in Baltimore on Thursday night, and the Eagles lost 19-11 to Mike’s Giants. That’s seven losses in a row for Philadelphia.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Court</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">10.5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">San Francisco beat my Raiders 38-17 and is 7-1. The other three lost: Miami 19-9 to Drew’s Lions, Washington 20-13 to Nicole’s Rams, and the Chargers 44-22 to Mike’s Texans. The Chargers are 0-8.</p>
</article>
