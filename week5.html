<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #C3D2C7; text-wrap: pretty">Drew went 3-1 and leads by three, the biggest gap of the season. Virginia’s Bills won in overtime on Monday night to pull her level with me in second, and Nicole went 0-4.</p>

<section aria-labelledby="notes-h" style="padding: 38px 16px 0; display: flex; flex-direction: column">
<h2 id="notes-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">How everyone's week went</h2>
<p style="margin: 6px 0 4px; font-size: 14.5px; color: var(--soft)">In standings order. The chip is each coach's record for the week.</p>

<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Drew</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--gold); color: var(--ongold)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px; color: var(--gold)">14 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Minnesota is 5-0 after a 23-13 win in New Orleans, and Detroit scored 31 straight points in a 45-21 win in Arizona. Ravens-Falcons was his own game: Baltimore won 30-23 in overtime, a point either way.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Jack</b><span style="font-size: 12px; color: var(--soft)">(me)</span><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">11 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Green Bay beat the Bears 31-7, and that was the only good news. The Raiders lost 45-17 in New England, the Colts lost in Pittsburgh, and Seattle lost 32-29 to Court’s 49ers.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Virginia</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">11 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Tampa Bay won for the first time on Thursday night in Dallas, Joe Burrow threw four touchdowns in Miami, and Buffalo beat the Rams 37-34 in overtime on Monday night. Only Cleveland lost, 17-12 to the Jets.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Mike</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-0-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">10.5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Houston got its first win, 26-3 in Tennessee, and the Giants came back from two touchdowns down in the fourth quarter to tie Washington 27-27. Kansas City and Carolina were on bye.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Caleb</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">9 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Drake Maye threw four touchdowns in a 45-17 win over my Raiders, the Jets ended a three-game losing streak, and Denver came back to win 23-17 in Los Angeles. The Saints lost to Drew’s Vikings.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Luke</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">9 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Jacksonville beat his own Eagles 19-17 in London on a field goal as time ran out, so that point was his either way. Pittsburgh beat my Colts 34-22, and Tennessee is 0-5.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Nicole</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">0-4</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">8 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">A rough week. Tampa Bay won in Dallas, Green Bay beat the Bears 31-7, Arizona gave up 45 to Detroit, and the Rams lost in overtime on Monday night after tying it with five seconds left.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Court</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-2-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">6.5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">San Francisco is 5-0 after a 32-29 win in Seattle. Washington tied the Giants after letting the clock run out in overtime with the ball in field-goal range, and Miami and the Chargers are both 0-5.</p>
</article>

<p style="margin: 0; font-size: 14.5px; color: var(--soft)">All 32 teams are owned, so every game is one of us against another. The winner's coach gets the point.</p>
