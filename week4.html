<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #C3D2C7; text-wrap: pretty">Atlanta’s 45-24 win in New Orleans on Monday night gave Drew a 3-1 week and kept him a point ahead of me. Mike and Nicole also went 3-1, and Nicole climbed from a tie for sixth to a tie for fourth.</p>

<section aria-labelledby="notes-h" style="padding: 38px 16px 0; display: flex; flex-direction: column">
<h2 id="notes-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">How everyone's week went</h2>
<p style="margin: 6px 0 4px; font-size: 14.5px; color: var(--soft)">In standings order. The chip is each coach's record for the week.</p>

<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Drew</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--gold); color: var(--ongold)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px; color: var(--gold)">11 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Minnesota is 4-0 after Will Reichard kicked five field goals for all 15 points against Miami. Baltimore beat Luke’s Titans, Atlanta ran for five touchdowns on Monday night, and only Carolina’s Sunday night win over Detroit kept it from another sweep.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Jack</b><span style="font-size: 12px; color: var(--soft)">(me)</span><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">10 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">The Colts won 30-13 in London, the Packers held off Tampa Bay 17-14, and Seattle beat the Chargers 30-23 despite a franchise-record 150 penalty yards. The Raiders took their first loss, 30-27 to Mike’s Chiefs.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Mike</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">9 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Kansas City is 4-0 going into its bye, and the Giants beat Nicole’s Cardinals 36-24, sealed by a 98-yard pick-six. Carolina knocked off Drew’s Lions on Sunday night. Houston lost a late lead to Dallas and is 0-4.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Nicole</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">8 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Two late comebacks. Dallas won in Houston on a CeeDee Lamb touchdown with 40 seconds left, and the Rams scored twice in the final four minutes to beat Luke’s Eagles. The Bears beat Caleb’s Jets 23-12; only Arizona lost.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Virginia</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">8 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Cleveland beat Luke’s Steelers on a 56-yard field goal with 10 seconds left. After that, Buffalo lost for the first time, Cincinnati lost to Luke’s Jaguars, and Tampa Bay fell to 0-4 against my Packers.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Luke</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">7 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Jacksonville is 3-1 after a fourth-down stop in the final minute in Cincinnati. Pittsburgh lost on the last-second kick in Cleveland, Tennessee is 0-4, and the Eagles gave up a 10-point fourth-quarter lead to the Rams.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Caleb</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">6 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">New England won 29-26 in Buffalo, handing Virginia’s Bills their first loss. The Jets, Broncos and Saints all lost, the Saints 45-24 on Monday night.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Court</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">San Francisco is 4-0 after beating Caleb’s Broncos 24-14. Washington lost in London, and Miami and the Chargers are both 0-4.</p>
</article>
