<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #C3D2C7; text-wrap: pretty">Drew went four for four and has first place to himself for the first time all season. The Bears won Monday night, so Nicole got her only point of the week and Luke stays two back.</p>

<section aria-labelledby="notes-h" style="padding: 38px 16px 0; display: flex; flex-direction: column">
<h2 id="notes-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">How everyone's week went</h2>
<p style="margin: 6px 0 4px; font-size: 14.5px; color: var(--soft)">In standings order. The chip is each coach's record for the week.</p>

<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Drew</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--gold); color: var(--ongold)">4-0</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px; color: var(--gold)">8 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Four for four, the first perfect week anyone has had. Atlanta ran all over my Packers on Thursday, Baltimore won in Rio, and first place is his alone.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Virginia</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">7 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Buffalo won through five turnovers and Cleveland beat Carolina on a go-ahead touchdown pass. Cincinnati lost on a last-drive strip-sack in Pittsburgh, and Tampa Bay is 0-3.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Jack</b><span style="font-size: 12px; color: var(--soft)">(me)</span><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">7 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">The Raiders are 3-0 on a 5.5-win total, and the Colts won on a 53-yard kick. Seattle outgained Washington by 179 yards and still lost.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Mike</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">6 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Kansas City is 3-0 and the Giants beat Luke's Titans on four field goals. Houston lost on a 53-yarder and is still winless.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Luke</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">6 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Pittsburgh closed out Cincinnati and Jacksonville beat New England 35-6. Then the Eagles lost 27-7 in Chicago to a third-string quarterback.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Nicole</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">The Bears saved her week on Monday night with Case Keenum at quarterback. The Rams blew a 16-0 halftime lead in Denver.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Caleb</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Denver's comeback from 16-0 down was the win of the week. The Patriots, Saints and Jets all lost.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Court</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">4 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">San Francisco is 3-0, and Washington took a point straight off my Seahawks. The Chargers and Dolphins are still looking for a win.</p>
</article>

<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Drew</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">Clean sweep</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">Ravens, Lions, Vikings, Falcons: four for four. Nobody had gone 4-0 in a week before this, and nobody had held first alone until now.</p>
</article>
<article style="flex: 0 0 272px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Caleb</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">The Boss Award</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">Comeback of the week. Denver trailed the Rams 16-0 at halftime and won 30-26. Talanoa Hufanga picked off Matthew Stafford twice, once for a touchdown and once on the final play.</p>
</article>
<article style="flex: 0 0 272px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Nicole</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">Monday rescue</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">Down to their third-string quarterback, the Bears beat the Eagles 27-7. Case Keenum threw two touchdowns and ran for another, and Nicole's week went from 0-3 to 1-3.</p>
</article>
<article style="flex: 0 0 272px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Luke</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">The closer</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">Pittsburgh had gone 20 straight drives without a touchdown, then scored two in the first quarter and sealed a 30-27 win over Virginia's Bengals on a Derrick Harmon strip-sack.</p>
</article>
<article style="flex: 0 0 272px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Virginia</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">Ugliest win</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">Buffalo turned it over five times and still beat the Chargers 24-16. The Bills had lost their previous 18 games with five or more turnovers.</p>
</article>
<article style="flex: 0 0 272px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Mike</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">No touchdowns required</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">The Giants beat Luke's Titans 12-7 on four Dominic Zvada field goals. As a Giants fan, I'll take it however it comes.</p>
</article>
<article style="flex: 0 0 272px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 700; color: var(--gold)">Me</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1">Heartbreak</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft)">Seattle outgained Washington 437 yards to 258, turned it over three times, and lost 33-31. At least the point stayed in the house. Washington is Court's.</p>
</article>
