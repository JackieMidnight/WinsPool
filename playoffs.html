<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philly Wins Pool, playoff bonus tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;background:#0A1F14}
a{color:#C9A24B}a:hover{color:#E2BE6A}
.pwp-dark{--bg:#0A1F14;--panel:#102A1B;--panel2:#0D2518;--ink:#EFEDE0;--soft:#9DB5A4;--line:#1D4530;--gold:#C9A24B;--goldsoft:rgba(201,162,75,.16);--up:#9CCB55;--dn:#8A9C90;--track:#1B3A27;--chip:#163A26;--ongold:#0A1F14;--reg:#4E8B63}
.pwp-light{--bg:#EEF2EA;--panel:#FFFFFF;--panel2:#F6F8F3;--ink:#0C2418;--soft:#4A6353;--line:#C7D6C7;--gold:#8A6B1C;--goldsoft:rgba(138,107,28,.12);--up:#2E6A1E;--dn:#66786C;--track:#DBE3D9;--chip:#E3EADF;--ongold:#FFFFFF;--reg:#2F6B45}
</style>
<script src="support.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="{{modeClass}}" style="width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; font-size: 16px; line-height: 1.5">

<header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-bottom: 1px solid var(--line)">
<a href="index.html" style="display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink)">
<svg width="26" height="31" viewBox="0 0 60 72" aria-hidden="true"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="4"></path><ellipse cx="30" cy="37" rx="13" ry="8" fill="#9A5530" transform="rotate(-28 30 37)"></ellipse><path d="M24 40.5 L36 33.5" stroke="#F4F1E4" stroke-width="2"></path></svg>
<span style="font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-size: 21px; letter-spacing: .03em; line-height: 1">PHILLY WINS POOL</span>
</a>
<button type="button" aria-label="Switch to light mode" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--soft); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</button>
</header>
<nav aria-label="Site sections" style="display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line)">
<a href="index.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">This week</a>
<a href="playoffs.html" aria-current="page" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; box-shadow: inset 0 -3px 0 var(--gold)">Playoffs</a>
<a href="season.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Season</a>
<a href="coaches.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Coaches</a>
<a href="teams.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Teams</a>
<a href="rules.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Rules</a>
</nav>

<div role="note" style="margin: 16px 16px 0; padding: 12px 14px; border: 1px dashed var(--gold); border-radius: 6px; background: var(--goldsoft); font-size: 13.5px; line-height: 1.5">
<b>Preview.</b> This tab appears after Week 18. To show how it works, it's filled in with our rosters and the real 2025 playoffs, the way it would have looked right after last season's Divisional round.
</div>

<section style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: var(--gold)">Conference Championships next</span>
<h1 style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 42px; line-height: 1">Playoff bonus tracker</h1>
<p style="margin: 0; font-size: 15px; color: var(--soft)">Four teams left, three coaches with a pulse. Max is the most a coach can still finish with if everything breaks their way.</p>
</section>

<section aria-label="Coaches" style="padding: 16px 16px 0; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 46px 46px 50px 50px; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--soft)"><span>Coach · teams alive</span><span style="text-align: right">Reg.</span><span style="text-align: right">Bonus</span><span style="text-align: right">Now</span><span style="text-align: right">Max</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 46px 46px 50px 50px; gap: 6px; align-items: center; min-height: 56px; border-bottom: 1px solid var(--line); opacity: {{r.op}}">
<span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3"><b style="font-size: 15px">{{r.name}}</b><span style="font-size: 12px; color: {{r.statusColor}}; font-weight: 600">{{r.status}}</span></span>
<span style="text-align: right; font-size: 14px; font-variant-numeric: tabular-nums">{{r.reg}}</span>
<span style="text-align: right; font-size: 14px; font-weight: 700; color: var(--gold)">{{r.bon}}</span>
<span style="text-align: right; font-family: Anton, Impact, sans-serif; font-size: 22px">{{r.now}}</span>
<span style="text-align: right; font-size: 14px; font-weight: 700">{{r.max}}</span>
</div>
</sc-for>
<p style="margin: 12px 0 0; font-size: 13.5px; line-height: 1.5">Caleb has both AFC teams left, so one of them is in the Super Bowl no matter what. That locks him at 46 or better. My Seahawks can't get me past that, so Nicole's Rams are the only thing standing in his way, and they have to win it all.</p>
</section>

<section aria-labelledby="left-h" style="padding: 30px 16px 0; display: flex; flex-direction: column; gap: 10px">
<h2 id="left-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">Still alive</h2>
<sc-for list="{{games}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--soft)"><span>{{g.label}}</span><span style="font-weight: 700; color: var(--gold)">Winner +3</span></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center">
<span style="display: flex; flex-direction: column"><b style="font-size: 16px">{{g.a}}</b><span style="font-size: 13px; color: var(--soft)">{{g.ao}} · {{g.ab}} banked</span></span>
<span style="font-size: 12px; color: var(--soft)">at</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; text-align: right"><b style="font-size: 16px">{{g.h}}</b><span style="font-size: 13px; color: var(--soft)">{{g.ho}} · {{g.hb}} banked</span></span>
</div>
<span style="font-size: 13px; line-height: 1.45">{{g.note}}</span>
</div>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--goldsoft); border: 1px solid var(--gold); border-radius: 6px"><span style="font-size: 14px; font-weight: 700">Super Bowl</span><b style="font-size: 14px; color: var(--gold)">Winner +5 more</b></div>
</section>

<section aria-labelledby="banked-h" style="padding: 30px 16px 0; display: flex; flex-direction: column; gap: 10px">
<h2 id="banked-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">Already banked</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; font-weight: 700; color: var(--soft)">Wild Card winners, +2 each</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{wc}}" as="t" hint-placeholder-count="6"><span style="font-size: 13px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel)"><b>{{t.t}}</b> {{t.o}}</span></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; font-weight: 700; color: var(--soft)">Divisional winners, +2 each</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{div}}" as="t" hint-placeholder-count="4"><span style="font-size: 13px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel)"><b>{{t.t}}</b> {{t.o}}</span></sc-for></div></div>
</div>
<p style="margin: 0; font-size: 13px; color: var(--soft)">Denver and Seattle had first-round byes, so their bonuses start with the Divisional round.</p>
</section>

<section style="padding: 30px 16px 0">
<div style="padding: 14px; border-radius: 6px; background: #0A1F14; border: 1px solid #1D4530; color: #EFEDE0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #9DB5A4">HOW IT ACTUALLY ENDED</span>
<span style="font-size: 14.5px; line-height: 1.5">Seattle beat the Rams 31-27, New England beat Denver 10-7, and Seattle won the Super Bowl 29-13. Caleb takes last year's replay 46 to my 44.5.</span>
</div>
</section>

<footer style="margin-top: auto; padding: 36px 16px 40px; text-align: center; border-top: 1px solid var(--line)">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--up)">FOUR TEAMS. ONE GOAL. BRAGGING RIGHTS FOR A YEAR.</span>
</footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    var mode = this.props.mode ?? 'dark';
    var ROSTER = { Nicole: ['LAR', 'CHI', 'DAL', 'ARI'], Luke: ['PHI', 'JAX', 'PIT', 'TEN'], Virginia: ['BUF', 'CIN', 'TB', 'CLE'], Jack: ['SEA', 'GB', 'IND', 'LV'], Caleb: ['DEN', 'NE', 'NO', 'NYJ'], Court: ['SF', 'LAC', 'WAS', 'MIA'], Drew: ['BAL', 'DET', 'MIN', 'ATL'], Mike: ['HOU', 'KC', 'NYG', 'CAR'] };
    var OWN = {}; Object.keys(ROSTER).forEach(function (c) { ROSTER[c].forEach(function (t) { OWN[t] = c; }); });
    // Sample data: 2025 regular-season points under our rules, and playoff results through the Divisional round
    var REG = { Nicole: 33.5, Luke: 37, Virginia: 31, Jack: 34.5, Caleb: 37, Court: 35, Drew: 34, Mike: 30 };
    var WC = ['LAR', 'CHI', 'BUF', 'SF', 'NE', 'HOU'], DIV = ['DEN', 'SEA', 'NE', 'LAR'];
    var ALIVE = ['DEN', 'NE', 'SEA', 'LAR'];
    var CONF = [['AFC Championship', 'NE', 'DEN'], ['NFC Championship', 'LAR', 'SEA']];
    var NICK = { DEN: 'Broncos', NE: 'Patriots', SEA: 'Seahawks', LAR: 'Rams' };
    var bank = {}; Object.keys(OWN).forEach(function (t) { bank[t] = 0; });
    WC.forEach(function (t) { bank[t] += 2; }); DIV.forEach(function (t) { bank[t] += 2; });
    var coaches = Object.keys(ROSTER);
    var bon = {}, now = {}, max = {};
    coaches.forEach(function (c) {
      bon[c] = ROSTER[c].reduce(function (s, t) { return s + bank[t]; }, 0);
      now[c] = REG[c] + bon[c];
      // best case: one alive team per conference can add +3, and only one team overall adds +5
      var confs = CONF.filter(function (g) { return OWN[g[1]] === c || OWN[g[2]] === c; }).length;
      max[c] = now[c] + confs * 3 + (confs ? 5 : 0);
    });
    // Title check: can this coach still finish first in any combination of the remaining three games?
    var outcomes = [];
    [0, 1].forEach(function (x) { [0, 1].forEach(function (y) { [0, 1].forEach(function (z) {
      var afc = CONF[0][1 + x], nfc = CONF[1][1 + y], champ = z ? afc : nfc, add = {};
      coaches.forEach(function (c) { add[c] = 0; });
      add[OWN[afc]] += 3; add[OWN[nfc]] += 3; add[OWN[champ]] += 5;
      outcomes.push(add);
    }); }); });
    var canWin = {};
    coaches.forEach(function (c) {
      canWin[c] = outcomes.some(function (add) { return coaches.every(function (d) { return d === c || now[c] + add[c] > now[d] + add[d]; }); });
    });
    var fmt = function (v) { return (Math.round(v * 10) / 10).toString(); };
    var rows = coaches.slice().sort(function (a, b) { return now[b] - now[a] || max[b] - max[a]; }).map(function (c) {
      var alive = ROSTER[c].filter(function (t) { return ALIVE.indexOf(t) >= 0; });
      var status = alive.length ? alive.join(' · ') + (canWin[c] ? ' · can win' : ' · can’t win it') : 'Done · no teams left';
      return { name: c === 'Jack' ? 'Jack (me)' : c, reg: fmt(REG[c]), bon: '+' + bon[c], now: fmt(now[c]), max: alive.length ? fmt(max[c]) : '—',
        status: status, statusColor: canWin[c] ? 'var(--up)' : 'var(--soft)', op: alive.length ? '1' : '.62' };
    });
    var games = CONF.map(function (g) {
      var a = g[1], h = g[2], oa = OWN[a], oh = OWN[h];
      return { label: g[0], a: NICK[a], ao: oa, ab: '+' + bank[a], h: NICK[h], ho: oh, hb: '+' + bank[h],
        note: oa === oh ? oa + ' owns both, so he banks +3 either way.' : (oa === 'Jack' ? 'Me' : oa) + ' vs ' + (oh === 'Jack' ? 'me' : oh) + '. The winner also gets a shot at +5.' };
    });
    var chip = function (t) { return { t: t, o: OWN[t] }; };
    return { modeClass: 'pwp-' + mode, rows: rows, games: games, wc: WC.map(chip), div: DIV.map(chip) };
  }
}
</script>
</body>
</html>
