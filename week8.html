<svg width="54" height="65" viewBox="0 0 60 72" aria-hidden="true" style="flex: none; margin-top: 4px"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="3"></path><path d="M30 9 L50 15 V35 C50 48 42 56 30 62 C18 56 10 48 10 35 V15 Z" fill="none" stroke="#9CCB55" stroke-opacity=".45" stroke-width="1"></path><ellipse cx="30" cy="35" rx="12" ry="7.5" fill="#9A5530" transform="rotate(-28 30 35)"></ellipse><path d="M24.5 38.5 L35.5 31.5" stroke="#F4F1E4" stroke-width="1.6"></path><path d="M27 34 L29 37.5 M29.5 32.6 L31.5 36 M32 31.2 L34 34.6" stroke="#F4F1E4" stroke-width="1.2"></path><rect x="18" y="49" width="24" height="9" rx="2" fill="#0A1F14" stroke="#C9A24B" stroke-width="1"></rect><text x="30" y="56.2" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="7" fill="#EFEDE0" letter-spacing=".6">2026</text></svg>

<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #C3D2C7; text-wrap: pretty">Virginia went 3-1, beat Drew twice and leads on her own for the first time this season, by a point. Drew went 1-3. Nicole’s 3-1 moved her up to third, and Mike went 0-2 with two teams on bye and fell to sixth.</p>

<section aria-labelledby="notes-h" style="padding: 38px 16px 0; display: flex; flex-direction: column">
<h2 id="notes-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">How everyone's week went</h2>
<p style="margin: 6px 0 4px; font-size: 14.5px; color: var(--soft)">In standings order. The chip is each coach's record for the week.</p>

<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Virginia</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--gold); color: var(--ongold)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px; color: var(--gold)">19 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">First place, alone. Buffalo beat Drew’s Ravens 36-10, Tampa Bay beat his Falcons 16-0 without completing a pass, and Joe Burrow threw five touchdowns and ran in the overtime winner as Cincinnati beat Luke’s Titans 43-36. Only Cleveland lost, 27-6 in Pittsburgh.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Drew</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-3</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">18 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Vikings-Lions was his own game, and Detroit won it 19-15 on Jared Goff’s touchdown to Jameson Williams with 4:35 left, so Minnesota isn’t unbeaten anymore. Baltimore lost by 26 in Buffalo, and Atlanta was shut out in Tampa. A point behind Virginia.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Nicole</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">3-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">16 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Chicago won 34-17 in Seattle on Monday night, and the Rams beat Court’s Chargers 24-9. Arizona beat her own Cowboys 33-30 in overtime after Dallas led by two touchdowns in the fourth quarter, so that point was hers either way. Up to third.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Caleb</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-1</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">15 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Denver sacked Patrick Mahomes on fourth-and-goal on the last play to beat Mike’s Chiefs 28-24, and New England won 24-19 in Miami. The Jets lost 38-33 to my Raiders. The Saints were on bye.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Jack</b><span style="font-size: 12px; color: var(--soft)">(me)</span><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">15 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Green Bay beat Mike’s Panthers 27-19 on Thursday night, and the Raiders ended a four-game losing streak, 38-33 at the Jets. Then the Colts lost 42-7 in Jacksonville, and Seattle lost 34-17 at home to Nicole’s Bears on Monday night. Still tied for fourth.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Mike</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">0-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">14.5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Houston and the Giants were off, and the two teams that played both lost. Kansas City got to the Denver 1-yard line and lost 28-24 when Malcolm Roach sacked Mahomes on the final play, and Carolina lost 27-19 in Green Bay. Third to sixth.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Luke</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">2-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">14 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Jacksonville beat my Colts 42-7, and Pittsburgh beat Virginia’s Browns 27-6. Tennessee led Cincinnati 36-29 with under four minutes left and lost in overtime, and the Eagles gave up 27 straight points in Washington. That’s six losses in a row for Philadelphia.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16.5px">Court</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink)">1-2</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 20px">9.5 pts</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">Washington scored the last 27 points to beat Luke’s Eagles 27-10 on Sunday night, its second win of the season. The Chargers are 0-7 after losing 24-9 to Nicole’s Rams, and Miami lost 24-19 to Caleb’s Patriots. San Francisco was on bye.</p>
</article>

<p style="margin: 0; font-size: 14.5px; color: var(--soft)">All 32 teams are owned, so every game is one of us against another. The winner's coach gets the point.</p>
