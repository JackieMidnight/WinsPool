<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Paint the right background before the page renders: the saved theme, else light on wide screens and dark on phones.
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('pwp-theme') || (window.matchMedia('(min-width: 1024px)').matches ? 'light' : 'dark')); } catch (e) {}
</script>
<title>Philly Wins Pool, past week</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;background:#0A1F14}
a{color:#C9A24B}a:hover{color:#E2BE6A}
.pwp-dark{--bg:#0A1F14;--panel:#102A1B;--panel2:#0D2518;--ink:#EFEDE0;--soft:#9DB5A4;--line:#1D4530;--gold:#C9A24B;--goldsoft:rgba(201,162,75,.16);--up:#9CCB55;--dn:#8A9C90;--track:#1B3A27;--chip:#163A26;--ongold:#0A1F14}
.pwp-light{--bg:#EEF2EA;--panel:#FFFFFF;--panel2:#F6F8F3;--ink:#0C2418;--soft:#4A6353;--line:#C7D6C7;--gold:#8A6B1C;--goldsoft:rgba(138,107,28,.12);--up:#2E6A1E;--dn:#66786C;--track:#DBE3D9;--chip:#E3EADF;--ongold:#FFFFFF}
html[data-theme=light] body{background:#EEF2EA}html[data-theme=dark] body{background:#0A1F14}
</style>
<script src="support.js?v=5" defer></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="{{modeClass}}" style="width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; font-size: 16px; line-height: 1.5">

<header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-bottom: 1px solid var(--line)">
<a href="index.html" style="display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink)">
<svg width="26" height="31" viewBox="0 0 60 72" aria-hidden="true"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="4"></path><ellipse cx="30" cy="37" rx="13" ry="8" fill="#9A5530" transform="rotate(-28 30 37)"></ellipse><path d="M24 40.5 L36 33.5" stroke="#F4F1E4" stroke-width="2"></path></svg>
<span style="font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-size: 21px; letter-spacing: .03em; line-height: 1">PHILLY WINS POOL</span>
</a>
<button type="button" aria-label="Switch to light mode" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--soft); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</button>
</header>

<nav aria-label="Site sections" style="display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line)">
<a href="index.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">This week</a>
<a href="season.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Season</a>
<a href="coaches.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Coaches</a>
<a href="teams.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Teams</a>
<a href="rosters.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Rosters</a>
<a href="rules.html" style="flex: none; display: flex; align-items: center; min-height: 46px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none">Rules</a>
</nav>

<div data-wide="bleed" role="group" aria-label="Pick a week" style="display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--line)">
<span style="flex: none; font-size: 12.5px; font-weight: 700; color: var(--soft); margin-right: 2px">Week</span>
<sc-for list="{{weekChips}}" as="w" hint-placeholder-count="6">
<sc-if value="{{w.link}}" hint-placeholder-val="{{true}}"><a href="{{w.href}}" aria-current="{{w.current}}" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid {{w.border}}; border-radius: 6px; background: {{w.bg}}; color: {{w.fg}}; font-weight: {{w.weight}}; font-size: 15px; text-decoration: none">{{w.n}}</a></sc-if>
<sc-if value="{{w.future}}" hint-placeholder-val="{{false}}"><span aria-disabled="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px dashed var(--line); border-radius: 6px; color: var(--soft); font-size: 15px; opacity: .6">{{w.n}}</span></sc-if>
</sc-for>
<a href="season.html" style="flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 6px 0 8px; font-size: 13.5px; font-weight: 700; color: var(--gold); text-decoration: none">All weeks</a>
</div>

<section data-wide="bleed" aria-labelledby="wk-title" style="position: relative; overflow: hidden; background-color: #0A1F14; background-image: radial-gradient(ellipse at 6% -6%, rgba(255,248,214,.13), transparent 42%), radial-gradient(ellipse at 94% -6%, rgba(255,248,214,.13), transparent 42%), repeating-linear-gradient(90deg, rgba(239,237,224,.045) 0 1px, transparent 1px 39px); color: #EFEDE0; padding: 24px 16px 22px; border-bottom: 4px solid #C9A24B; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
<span style="font-size: 13.5px; font-weight: 700; color: #C9A24B; letter-spacing: .02em">{{kicker}}</span>
<h1 id="wk-title" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 56px; line-height: .95; letter-spacing: .005em; text-wrap: balance">{{headline}}</h1>
</div>
<svg width="54" height="65" viewBox="0 0 60 72" aria-hidden="true" style="flex: none; margin-top: 4px"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="3"></path><path d="M30 9 L50 15 V35 C50 48 42 56 30 62 C18 56 10 48 10 35 V15 Z" fill="none" stroke="#9CCB55" stroke-opacity=".45" stroke-width="1"></path><ellipse cx="30" cy="35" rx="12" ry="7.5" fill="#9A5530" transform="rotate(-28 30 35)"></ellipse><path d="M24.5 38.5 L35.5 31.5" stroke="#F4F1E4" stroke-width="1.6"></path><path d="M27 34 L29 37.5 M29.5 32.6 L31.5 36 M32 31.2 L34 34.6" stroke="#F4F1E4" stroke-width="1.2"></path><rect x="18" y="49" width="24" height="9" rx="2" fill="#0A1F14" stroke="#C9A24B" stroke-width="1"></rect><text x="30" y="56.2" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="7" fill="#EFEDE0" letter-spacing=".6">2026</text></svg>
</div>
<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #C3D2C7; text-wrap: pretty">{{summary}}</p>

<svg width="358" height="30" viewBox="0 0 358 40" preserveAspectRatio="none" aria-hidden="true" style="display: block; margin-bottom: -12px"><path d="M0 40 V30 H14 V22 H26 V30 H34 V16 H48 V26 H58 V12 H64 V5 H66 V12 H72 V28 H84 V20 H98 V30 H110 V14 H118 V4 H121 V14 H128 V26 H142 V18 H156 V30 H168 V22 H178 V8 H181 V1 H183 V8 H186 V22 H196 V28 H210 V16 H224 V26 H236 V10 H244 V26 H256 V20 H270 V30 H282 V18 H290 V12 H300 V24 H314 V28 H326 V20 H338 V30 H358 V40 Z" fill="#1D4530"></path></svg>
<div role="group" aria-label="Standings after Week {{week}}" style="position: relative; background: #051109; border: 1px solid #1D4530; border-radius: 6px; padding: 4px 12px 2px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #1D4530; font-size: 12.5px; color: #8FA898"><span style="font-weight: 700; color: #C9A24B">Standings after Week {{week}}</span><span>{{statusLabel}}</span></div>
<div style="display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px 48px 36px; gap: 8px; padding: 7px 0 3px; font-size: 11px; color: #8FA898"><span></span><span>Coach and teams</span><span style="text-align: right">Wk {{week}}</span><span style="text-align: right">Pts</span><span style="text-align: right">Move</span></div>
<sc-for list="{{standings}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px 48px 36px; gap: 8px; align-items: center; height: 54px; border-top: 1px solid #12301F">
<span style="font-family: Anton, Impact, sans-serif; font-size: 16px; color: #8FA898; text-align: right">{{r.rk}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><b style="font-size: 16px; font-weight: 700; color: {{r.nameColor}}">{{r.name}}</b><small style="font-size: 11.5px; color: #8FA898; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.teams}}</small></span>
<span style="font-size: 13px; color: #C3D2C7; text-align: right; font-variant-numeric: tabular-nums">{{r.wk}}</span>
<span style="font-family: Anton, Impact, sans-serif; font-size: 32px; line-height: 1; text-align: right; color: {{r.ptsColor}}; font-variant-numeric: tabular-nums">{{r.pts}}</span>
<span aria-label="{{r.mvLabel}}" style="font-size: 12px; font-weight: 700; text-align: right; white-space: nowrap; color: {{r.mvColor}}">{{r.mv}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #8FA898">{{standingsNote}}</p>
<a href="rules.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14.5px; font-weight: 700; color: #C9A24B; text-decoration: none">First time here? How scoring works<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</section>

<section aria-labelledby="ledger-h" style="padding: 34px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="ledger-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">Head-to-head ledger</h2>
<p style="margin: 0; font-size: 14.5px; color: var(--soft)">Every finished Week {{week}} game, with each team's coach. The winner's coach gets the point.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ledger}}" as="g" hint-placeholder-count="16">
<div style="background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="display: grid; grid-template-columns: 38px minmax(0, 1fr) 24px; gap: 4px; align-items: baseline; font-size: 13.5px"><b style="letter-spacing: .02em; color: {{g.aColor}}">{{g.a}}</b><span style="color: {{g.aColor}}; font-weight: {{g.aWeight}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.ac}}</span><span style="font-family: Anton, Impact, sans-serif; font-size: 16px; text-align: right; color: {{g.aColor}}">{{g.as}}</span></div>
<div style="display: grid; grid-template-columns: 38px minmax(0, 1fr) 24px; gap: 4px; align-items: baseline; font-size: 13.5px"><b style="letter-spacing: .02em; color: {{g.hColor}}">{{g.h}}</b><span style="color: {{g.hColor}}; font-weight: {{g.hWeight}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.hc}}</span><span style="font-family: Anton, Impact, sans-serif; font-size: 16px; text-align: right; color: {{g.hColor}}">{{g.hs}}</span></div>
</div>
</sc-for>
</div>
<sc-if value="{{live}}" hint-placeholder-val="{{false}}">
<h3 style="margin: 10px 0 0; font-size: 15px; font-weight: 800; color: var(--soft)">Still to play</h3>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{upcoming}}" as="u" hint-placeholder-count="6">
<div style="border: 1px dashed var(--line); border-radius: 6px; padding: 7px 10px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 11px; color: var(--soft); margin-bottom: 2px">{{u.day}}</span>
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px; font-size: 13.5px"><b style="letter-spacing: .02em; white-space: nowrap">{{u.a}}</b><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{u.ac}}</span></div>
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px; font-size: 13.5px"><b style="letter-spacing: .02em; white-space: nowrap">@ {{u.h}}</b><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{u.hc}}</span></div>
</div>
</sc-for>
</div>
</sc-if>
</section>


<footer style="margin-top: auto; padding: 40px 16px 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; border-top: 1px solid var(--line)">
<span style=" font-size: 12.5px; color: var(--soft)">Filed by Jackie Ternus, commissioner. Scores from NFL.com and FootballDB.</span>
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--up)">FOUR TEAMS. ONE GOAL. BRAGGING RIGHTS FOR A YEAR.</span>
</footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    var mode = this.props.mode ?? 'dark';
    var ROSTER = { Nicole: ['LAR', 'CHI', 'DAL', 'ARI'], Luke: ['PHI', 'JAX', 'PIT', 'TEN'], Virginia: ['BUF', 'CIN', 'TB', 'CLE'], Jack: ['SEA', 'GB', 'IND', 'LV'], Caleb: ['DEN', 'NE', 'NO', 'NYJ'], Court: ['SF', 'LAC', 'WAS', 'MIA'], Drew: ['BAL', 'DET', 'MIN', 'ATL'], Mike: ['HOU', 'KC', 'NYG', 'CAR'] };
    // Results by week: away home awayScore homeScore. Add a week by appending '/...' with its games.
    var RESULTS = 'BUF HOU 36 31,TB CIN 27 33,CLE JAX 10 34,NE SEA 10 13,MIA LV 13 27,GB MIN 22 39,BAL IND 41 23,WAS PHI 22 24,ATL PIT 13 20,NYJ TEN 23 10,NO DET 30 31,DEN KC 10 31,DAL NYG 20 28,CHI CAR 59 37,ARI LAC 26 14,SF LAR 27 7' +
      '/DET BUF 31 41,PHI TEN 24 20,PIT NE 3 20,MIN CHI 9 3,CAR ATL 34 3,GB NYJ 20 17,NO BAL 24 17,CIN HOU 20 6,CLE TB 23 19,JAX DEN 13 20,LV LAC 26 14,SEA ARI 31 7,MIA SF 13 35,WAS DAL 20 37,IND KC 30 33,NYG LAR 6 28' +
      '/ATL GB 35 14,HOU IND 17 19,KC MIA 24 10,LAC BUF 16 24,TEN NYG 7 12,CIN PIT 27 30,SEA WAS 31 33,NE JAX 6 35,CAR CLE 18 21,NYJ DET 24 31,ARI SF 30 36,MIN TB 23 16,LV NO 35 27,BAL DAL 34 31,LAR DEN 26 30,PHI CHI 7 27' +
      '/PIT CLE 24 27,IND WAS 30 13,NE BUF 29 26,ARI NYG 24 36,NYJ CHI 12 23,TEN BAL 18 24,GB TB 17 14,DAL HOU 34 30,JAX CIN 22 17,LAR PHI 24 20';
    // Week 4 is in progress: its finished games are in RESULTS above, the rest are listed here.
    // When the week is over, add its last games to RESULTS and empty its PENDING entry.
    var PENDING = {
      4: [['Sun 4:05', 'MIA', 'MIN'], ['Sun 4:25', 'DEN', 'SF'], ['Sun 4:25', 'LAC', 'SEA'], ['Sun 4:25', 'KC', 'LV'], ['Sun 8:20', 'DET', 'CAR'], ['Mon 8:15', 'ATL', 'NO']]
    };
    var INFO = [
      { headline: 'Luke and Drew open 3-1', posted: 'Tuesday, Sep 15' },
      { headline: 'Virginia and I tie for first', posted: 'Tuesday, Sep 22' },
      { headline: 'Drew goes 4-0', posted: 'Tuesday, Sep 29' },
      { headline: 'Week 4 so far', posted: '' }
    ];
    var POSTED = 3; // the week the home page's write-up covers
    var SEASON_WEEKS = 18, SHOWN_WEEKS = 6;
    var OWN = {}; Object.keys(ROSTER).forEach(function (c) { ROSTER[c].forEach(function (t) { OWN[t] = c; }); });
    var C = Object.keys(ROSTER);
    var weeks = RESULTS.split('/').map(function (w) { return w.split(',').map(function (g) { var f = g.split(' '); return { a: f[0], h: f[1], as: +f[2], hs: +f[3] }; }); });
    var latest = weeks.length;
    var m = /[?&]w=(\d+)/.exec(location.search);
    var wk = Math.min(Math.max(m ? +m[1] : 1, 1), latest);
    var pending = PENDING[wk] || [];
    var live = pending.length > 0;

    // A win is a point, a tie half a point to each side.
    var pts = {}; C.forEach(function (c) { pts[c] = 0; });
    var ranks = [], recs = [];
    weeks.slice(0, wk).forEach(function (games) {
      var rec = {}; C.forEach(function (c) { rec[c] = [0, 0, 0]; });
      games.forEach(function (g) {
        var oa = OWN[g.a], oh = OWN[g.h];
        if (g.as === g.hs) { pts[oa] += 0.5; pts[oh] += 0.5; rec[oa][2] += 1; rec[oh][2] += 1; return; }
        var awayWon = g.as > g.hs, win = awayWon ? oa : oh, lose = awayWon ? oh : oa;
        pts[win] += 1; rec[win][0] += 1; rec[lose][1] += 1;
      });
      var r = {};
      C.forEach(function (c) { r[c] = 1 + C.filter(function (d) { return pts[d] > pts[c]; }).length; });
      ranks.push(r); recs.push(rec);
    });
    var fmtRec = function (r) { return r[0] + '-' + r[1] + (r[2] ? '-' + r[2] : ''); };
    var rank = ranks[wk - 1], prev = ranks[wk - 2], rec = recs[wk - 1];
    var tied = function (c) { return C.some(function (d) { return d !== c && rank[d] === rank[c]; }); };
    var order = C.slice().sort(function (x, y) { return pts[y] - pts[x] || x.localeCompare(y); });
    var standings = order.map(function (c, i) {
      var mv = prev ? prev[c] - rank[c] : 0, lead = rank[c] === 1;
      return {
        rk: (tied(c) ? 'T' : '') + rank[c], name: c, teams: ROSTER[c].join(' '), wk: fmtRec(rec[c]), pts: pts[c],
        nameColor: lead ? '#C9A24B' : '#EFEDE0', ptsColor: lead ? '#C9A24B' : '#EFEDE0',
        mv: !prev ? '' : mv > 0 ? '▲' + mv : mv < 0 ? '▼' + (-mv) : '–',
        mvColor: mv > 0 ? '#9CCB55' : '#8FA898',
        mvLabel: !prev ? 'first week' : mv > 0 ? 'up ' + mv : mv < 0 ? 'down ' + (-mv) : 'no change'
      };
    });

    var list = function (xs) { return xs.length === 1 ? xs[0] : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]; };
    var leaders = order.filter(function (c) { return rank[c] === 1; });
    var wkPts = function (c) { return rec[c][0] + rec[c][2] / 2; };
    var best = Math.max.apply(null, C.map(wkPts));
    var bestCoaches = order.filter(function (c) { return wkPts(c) === best; });
    var gamesLeft = pending.length === 1 ? '1 game' : pending.length + ' games';
    var summary = list(leaders) + (leaders.length > 1 ? ' share first' : ' leads') + ' with ' + pts[leaders[0]] + ' points' +
      (live ? ', and ' + gamesLeft + ' are still to play this week. Best week so far: ' : ' after Week ' + wk + '. Best week: ') +
      list(bestCoaches) + ' at ' + fmtRec(rec[bestCoaches[0]]) + '.';

    var ledger = weeks[wk - 1].map(function (g) {
      var tie = g.as === g.hs, aw = g.as > g.hs;
      return {
        a: g.a, ac: OWN[g.a] + (tie ? '  +½' : aw ? '  +1' : ''), as: g.as, h: g.h, hc: OWN[g.h] + (tie ? '  +½' : aw ? '' : '  +1'), hs: g.hs,
        aColor: aw || tie ? 'var(--ink)' : 'var(--soft)', hColor: !aw || tie ? 'var(--ink)' : 'var(--soft)',
        aWeight: aw && !tie ? '700' : '400', hWeight: !aw && !tie ? '700' : '400'
      };
    });
    var upcoming = pending.map(function (g) { return { day: g[0], a: g[1], ac: OWN[g[1]], h: g[2], hc: OWN[g[2]] }; });

    var weekChips = [];
    for (var n = 1; n <= Math.min(SHOWN_WEEKS, SEASON_WEEKS); n++) {
      var cur = n === wk, played = n <= latest;
      weekChips.push({ n: n, link: played, future: !played, href: n === POSTED ? 'index.html' : 'week.html?w=' + n, current: cur ? 'page' : 'false',
        border: cur ? 'var(--gold)' : 'var(--line)', bg: cur ? 'var(--gold)' : 'var(--panel)', fg: cur ? 'var(--ongold)' : 'var(--ink)', weight: cur ? '800' : '700' });
    }

    var info = INFO[wk - 1] || { headline: 'Week ' + wk, posted: '' };
    document.title = 'Philly Wins Pool, Week ' + wk;
    return {
      modeClass: 'pwp-' + mode, week: wk, weekChips: weekChips, standings: standings, ledger: ledger, summary: summary,
      upcoming: upcoming, live: live,
      headline: info.headline,
      statusLabel: live ? 'So far' : 'Final',
      kicker: 'Week ' + wk + (live ? ' · In progress · ' + weeks[wk - 1].length + ' of ' + (weeks[wk - 1].length + pending.length) + ' games final' : ' · Final' + (info.posted ? ' · Posted ' + info.posted : '')),
      standingsNote: 'Big number is total points.' + (prev ? ' Arrows are places moved since Week ' + (wk - 1) + '.' : '') + ' Tied coaches share a rank.' + (live ? ' Updates as games finish.' : '')
    };
  }
}
</script>
</body>
</html>
