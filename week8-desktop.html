<!doctype html>
<html lang="en">
<head>

<script>

try { document.documentElement.setAttribute('data-theme', localStorage.getItem('pwp-theme') || (window.matchMedia('(min-width: 1024px)').matches ? 'light' : 'dark')); } catch (e) {}
</script>
<script>
(function () {
  var wide = window.matchMedia('(min-width: 1024px)');
  var go = function () { if (!wide.matches && !window.matchMedia('print').matches) location.replace('week8.html'); };
  go();
  if (wide.addEventListener) wide.addEventListener('change', go); else if (wide.addListener) wide.addListener(go);
})();
</script>
<title>Philly Wins Pool, Week 8 write-up</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;background:#EEF2EA}
a{color:#8A6B1C}a:hover{color:#6E5412}
.pwp-dark{--bg:#0A1F14;--panel:#102A1B;--panel2:#0D2518;--ink:#EFEDE0;--soft:#9DB5A4;--line:#1D4530;--gold:#C9A24B;--goldsoft:rgba(201,162,75,.16);--up:#9CCB55;--dn:#8A9C90;--track:#1B3A27;--chip:#163A26;--ongold:#0A1F14}
.pwp-light{--bg:#EEF2EA;--panel:#FFFFFF;--panel2:#F6F8F3;--ink:#0C2418;--soft:#4A6353;--line:#C7D6C7;--gold:#8A6B1C;--goldsoft:rgba(138,107,28,.12);--up:#2E6A1E;--dn:#66786C;--track:#DBE3D9;--chip:#E3EADF;--ongold:#FFFFFF}

</style>
<script src="support.js?v=6" defer></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="{{modeClass}}" style="width: 100%; min-width: 1000px; min-height: 100vh; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; font-size: 16px; line-height: 1.5">

<header style="display: flex; align-items: center; gap: 24px; height: 72px; padding: 0 max(88px, calc((100% - 1200px) / 2)); border-bottom: 1px solid var(--line); background: var(--panel)">
<a href="index.html" style="display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink)">
<svg width="32" height="38" viewBox="0 0 60 72" aria-hidden="true"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="4"></path><ellipse cx="30" cy="37" rx="13" ry="8" fill="#9A5530" transform="rotate(-28 30 37)"></ellipse><path d="M24 40.5 L36 33.5" stroke="#F4F1E4" stroke-width="2"></path></svg>
<span style="font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-size: 25px; letter-spacing: .03em; line-height: 1">PHILLY WINS POOL</span>
</a>
<nav aria-label="Site sections" style="display: flex; gap: 2px; margin-left: auto">
<a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--soft); text-decoration: none">This week</a>
<a href="season.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--soft); text-decoration: none">Season</a>
<a href="coaches.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--soft); text-decoration: none">Coaches</a>
<a href="teams.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--soft); text-decoration: none">Teams</a>
<a href="rosters.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--soft); text-decoration: none">Rosters</a>
<a href="rules.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; color: var(--soft); text-decoration: none">Rules</a>
</nav>
<button type="button" aria-label="Switch to dark mode" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--soft); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg>
</button>
</header>

<div role="group" aria-label="Pick a week" style="display: flex; align-items: center; gap: 6px; height: 64px; padding: 0 max(88px, calc((100% - 1200px) / 2)); overflow-x: auto; border-bottom: 1px solid var(--line)">
<span style="font-size: 13px; font-weight: 700; color: var(--soft); margin-right: 6px">Week</span>
<sc-for list="{{weeks}}" as="w" hint-placeholder-count="18">
<a href="{{w.href}}" aria-current="{{w.current}}" style="flex: none; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 6px; font-size: 15px; text-decoration: none; border: {{w.border}}; background: {{w.bg}}; color: {{w.fg}}; font-weight: {{w.weight}}; opacity: {{w.opacity}}">{{w.n}}</a>
</sc-for>
<a href="season.html" style="flex: none; white-space: nowrap; margin-left: 10px; display: flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; text-decoration: none">All weeks</a>
</div>

<section aria-labelledby="dwk-title" style="position: relative; overflow: hidden; background-color: #0A1F14; background-image: radial-gradient(ellipse at 4% -10%, rgba(255,248,214,.13), transparent 34%), radial-gradient(ellipse at 96% -10%, rgba(255,248,214,.13), transparent 34%), repeating-linear-gradient(90deg, rgba(239,237,224,.045) 0 1px, transparent 1px 128px); color: #EFEDE0; padding: 52px max(88px, calc((100% - 1200px) / 2)) 56px; border-bottom: 4px solid #C9A24B">
<svg width="100%" height="70" viewBox="0 0 358 40" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; display: block"><path d="M0 40 V30 H14 V22 H26 V30 H34 V16 H48 V26 H58 V12 H64 V5 H66 V12 H72 V28 H84 V20 H98 V30 H110 V14 H118 V4 H121 V14 H128 V26 H142 V18 H156 V30 H168 V22 H178 V8 H181 V1 H183 V8 H186 V22 H196 V28 H210 V16 H224 V26 H236 V10 H244 V26 H256 V20 H270 V30 H282 V18 H290 V12 H300 V24 H314 V28 H326 V20 H338 V30 H358 V40 Z" fill="#12301F"></path></svg>
<div style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, 560px); gap: clamp(32px, 4vw, 56px); align-items: start">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="46" height="55" viewBox="0 0 60 72" aria-hidden="true"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="3"></path><ellipse cx="30" cy="35" rx="12" ry="7.5" fill="#9A5530" transform="rotate(-28 30 35)"></ellipse><path d="M24.5 38.5 L35.5 31.5" stroke="#F4F1E4" stroke-width="1.6"></path><rect x="18" y="49" width="24" height="9" rx="2" fill="#0A1F14" stroke="#C9A24B" stroke-width="1"></rect><text x="30" y="56.2" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="7" fill="#EFEDE0">2026</text></svg>
<span style="font-size: 15px; font-weight: 700; color: #C9A24B; letter-spacing: .02em">Week 8 · Final · Posted Tuesday, Nov 3</span>
</div>
<h1 id="dwk-title" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(64px, 6.4vw, 92px); line-height: .95; letter-spacing: .005em; text-wrap: balance">Virginia takes first</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #C3D2C7; max-width: 30em; text-wrap: pretty">Virginia went 3-1, beat Drew twice and leads on her own for the first time this season, by a point. Drew went 1-3. Nicole’s 3-1 moved her up to third, and Mike went 0-2 with two teams on bye and fell to sixth.</p>
<div style="display: flex; gap: 10px; margin-top: 8px">
<a href="share.html" style="flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 6px; background: #C9A24B; color: #0A1F14; font-size: 15px; font-weight: 800; text-decoration: none"><svg width="17" height="17" style="flex: none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"></path></svg>Save standings image</a>
<button type="button" style="flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 6px; border: 1px solid #2A5A3F; background: transparent; color: #EFEDE0; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg width="17" height="17" style="flex: none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>Copy group text</button>
</div>
<a href="rules.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 700; color: #C9A24B; text-decoration: none">First time here? How scoring works<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Standings after Week 8" style="background: #051109; border: 1px solid #1D4530; border-radius: 8px; padding: 4px 18px 2px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #1D4530; font-size: 13px; color: #8FA898"><span style="font-weight: 700; color: #C9A24B">Standings after Week 8</span><span>Final</span></div>
<div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 60px 60px 50px; gap: 12px; padding: 8px 0 4px; font-size: 12px; color: #8FA898"><span></span><span>Coach and teams</span><span style="text-align: right">Week 8</span><span style="text-align: right">Points</span><span style="text-align: right">Move</span></div>
<sc-for list="{{standings}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 60px 60px 50px; gap: 12px; align-items: center; height: 56px; border-top: 1px solid #12301F">
<span style="font-family: Anton, Impact, sans-serif; font-size: 18px; color: #8FA898; text-align: right">{{r.rk}}</span>
<span style="display: flex; align-items: baseline; gap: 12px; min-width: 0"><b style="font-size: 17px; font-weight: 700; color: {{r.nameColor}}">{{r.name}}</b><small style="font-size: 12.5px; color: #8FA898; letter-spacing: .05em; white-space: nowrap">{{r.teams}}</small></span>
<span style="font-size: 14px; color: #C3D2C7; text-align: right">{{r.wk}}</span>
<span style="font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1; text-align: right; color: {{r.ptsColor}}">{{r.pts}}</span>
<span aria-label="{{r.mvLabel}}" style="font-size: 13px; font-weight: 700; text-align: right; color: {{r.mvColor}}">{{r.mv}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #8FA898">Big number is total points. Arrows are places moved since Week 7. Tied coaches share a rank.</p>
</div>
</div>
</section>

<main style="display: flex; flex-direction: column; gap: 60px; padding: 56px max(88px, calc((100% - 1200px) / 2)) 0">

<section aria-labelledby="dnotes-h" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 16px"><h2 id="dnotes-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05">How everyone's week went</h2><span style="font-size: 15px; color: var(--soft)">In standings order</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="8">
<article style="background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 15px 16px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 17px">{{n.name}}</b><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: {{n.chipBg}}; color: {{n.chipFg}}">{{n.wk}}</span><span style="margin-left: auto; font-family: Anton, Impact, sans-serif; font-size: 21px">{{n.pts}}</span></div>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft); text-wrap: pretty">{{n.text}}</p>
</article>
</sc-for>
</div>
</section>

<div style="display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; align-items: start">
<section aria-labelledby="dledger-h" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="dledger-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05">Head-to-head ledger</h2><span style="font-size: 15px; color: var(--soft)">Every game is one of us against another. The winner's coach gets the point.</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px">
<sc-for list="{{ledger}}" as="g" hint-placeholder-count="16">
<div style="background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px 9px; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 11.5px; color: var(--soft); margin-bottom: 2px">{{g.day}}</span>
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 26px; gap: 6px; align-items: baseline; font-size: 14px"><b style="letter-spacing: .02em; color: {{g.aColor}}">{{g.a}}</b><span style="color: {{g.aColor}}; font-weight: {{g.aWeight}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.ac}}</span><span style="font-family: Anton, Impact, sans-serif; font-size: 17px; text-align: right; color: {{g.aColor}}">{{g.as}}</span></div>
<div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 26px; gap: 6px; align-items: baseline; font-size: 14px"><b style="letter-spacing: .02em; color: {{g.hColor}}">{{g.h}}</b><span style="color: {{g.hColor}}; font-weight: {{g.hWeight}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.hc}}</span><span style="font-family: Anton, Impact, sans-serif; font-size: 17px; text-align: right; color: {{g.hColor}}">{{g.hs}}</span></div>
</div>
</sc-for>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 28px">
<section aria-labelledby="dbye-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="dbye-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05">Bye watch</h2>
<p style="margin: 0; font-size: 15.5px">Pittsburgh and Tennessee are off in Week 9, and both are Luke’s, so he plays this week with two teams.</p>
<div style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--panel)">
<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line)">
<span style="font-size: 13.5px; font-weight: 800; color: var(--soft); padding-top: 3px">Week 10</span>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>CHI</b> Nicole</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>DEN</b> Caleb</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>PHI</b> Luke</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>TB</b> Virginia</span></div><span style="font-size: 14px; color: var(--soft)">Four teams off, one each for four coaches.</span></div>
</div>
<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 13px 16px">
<span style="font-size: 13.5px; font-weight: 800; color: var(--soft); padding-top: 3px">Week 11</span>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>ATL</b> Drew</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>CLE</b> Virginia</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>GB</b> Jack</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>LAR</b> Nicole</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>NE</b> Caleb</span><span style="font-size: 13.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px"><b>SEA</b> Jack</span></div><span style="font-size: 14px; color: var(--soft)">I lose the Packers and Seahawks in the same week.</span></div>
</div>
</div>
</section>
<section aria-labelledby="dshare-h" style="display: flex; gap: 16px; align-items: center; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px">
<div aria-hidden="true" style="flex: none; width: 72px; height: 96px; border-radius: 4px; background: #0A1F14; border: 2px solid #C9A24B; display: flex; flex-direction: column; gap: 5px; padding: 8px 7px">
<div style="height: 7px; width: 38px; background: #C9A24B; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .8; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
<div style="height: 4px; background: #EFEDE0; opacity: .55; border-radius: 1px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div style="display: flex; flex-direction: column"><h2 id="dshare-h" style="margin: 0; font-size: 17px; font-weight: 800">Standings for the group text</h2><span style="font-size: 14px; color: var(--soft)">An image sized for iMessage, plus a text version with the link.</span></div>
<div style="display: flex; gap: 8px">
<a href="share.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 6px; background: var(--gold); color: var(--ongold); font-size: 14px; font-weight: 800; text-decoration: none">Save image</a>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Copy text</button>
</div>
</div>
</section>
</div>
</div>

<section aria-labelledby="dawards-h" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="dawards-h" style="margin: 0; font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.05">Weekly awards</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{awards}}" as="a" hint-placeholder-count="7">
<article style="background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 17px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: var(--gold)">{{a.who}}</span>
<h3 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 23px; line-height: 1.1">{{a.title}}</h3>
<p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--soft)">{{a.text}}</p>
</article>
</sc-for>
<article style="background: #0A1F14; border: 1px solid #1D4530; border-radius: 8px; padding: 16px 17px; display: flex; flex-direction: column; justify-content: center; gap: 6px; color: #EFEDE0">
<span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #9DB5A4">QUOTE OF THE SEASON</span>
<span style="font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1.1; color: #C9A24B">“WE LOVE AI”</span>
<span style="font-size: 14px; font-style: italic; color: #9DB5A4">Luke Eisenhardt</span>
</article>
</div>
</section>
